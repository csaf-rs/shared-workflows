name: Conventional Commit Linting
description: >
  Lint commit messages and/or PR titles for an already checked-out repository (ensure checkout uses
  fetch-depth: 0 to lint all commits). Requires the permission to read contents and pull-request
  information

runs:
  using: composite

  steps:
    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        package-manager-cache: false
    - name: Install commitlint
      shell: bash
      run: npm install -g -D --ignore-scripts @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2 # Beware that npm packages can be unpublished for the first 72h, so if possible only pin after these.
    - name: Validate current commit (last commit) with commitlint
      shell: bash
      if: github.event_name == 'push'
      env:
        PUSH_BASE_SHA: ${{ github.event.before }}
        PUSH_HEAD_SHA: ${{ github.event.after }}
      # When deleting/creating a branch or a tag during a push event, after/before is set to an all zero commit sha: https://stackoverflow.com/questions/61860732/how-can-i-get-the-previous-commit-before-a-push-or-merge-in-github-action-workfl. This causes commitlint to fail. To prevent this, in such cases just lint the last commit.
      run: |
        if [[ "$PUSH_HEAD_SHA" =~ ^0+$ ]]; then
          echo "Deleted target doesn't need linting."
        elif [[ "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
          commitlint -g ${{ github.action_path }}/commitlint.config.mjs --last --verbose
        else
          commitlint -g ${{ github.action_path }}/commitlint.config.mjs --from "$PUSH_BASE_SHA" --to "$PUSH_HEAD_SHA" --verbose
        fi
    - name: Validate PR title
      shell: bash
      if: github.event_name == 'pull_request'
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        echo "$PR_TITLE" | commitlint -g ${{ github.action_path }}/commitlint.config.mjs --verbose
    - name: Check PR's commits with commitlint
      shell: bash
      if: github.event_name == 'pull_request'
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        commitlint -g ${{ github.action_path }}/commitlint.config.mjs --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose || true
