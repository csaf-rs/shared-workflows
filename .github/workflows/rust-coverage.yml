# Runs cargo-llvm-cov for the caller repository and adds
# overall and per-file coverage results to the GitHub job summary.
name: Rust Coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      # Checkout the coverage scripts from the same commit as this reusable workflow into the .shared directory
      - name: Checkout coverage scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          sparse-checkout: |
            scripts/coverage

      - name: Use cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage

      - name: Update rustup
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: rustup update stable --no-self-update

      - name: Cache cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked

      # Generate coverage report in JSON format and save it to a temporary file
      - name: Generate coverage
        run: cargo llvm-cov --locked --workspace --json > /tmp/coverage.json

      # Convert the generated coverage report into overall and per-file summaries and add them to the GitHub job summary
      - name: Coverage summary
        run: ./.shared/scripts/coverage/coverage_report.sh < /tmp/coverage.json >> "$GITHUB_STEP_SUMMARY"